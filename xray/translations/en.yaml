configuration:
  tunnel_address:
    name: "Server name"
    description: "Tailscale machine name of the server (for example vps-test), not an IP."
  tunnel_dns:
    name: "Tailscale DNS"
    description: "Resolver for the server name. Leave at 100.100.100.100 (Tailscale MagicDNS)."
  tunnel_port:
    name: "Server port"
    description: "Port of the tunnel inbound on the server (reachable over Tailscale only)."
  tunnel_uuid:
    name: "Tunnel ID"
    description: "The UUID the server holds for this tunnel. Treat it like a password."
  tunnel_congestion:
    name: "Tunnel congestion control"
    description: >-
      system: kernel default (cubic). bbr: paces the tunnel, copes with a small upload
      buffer; usually much faster. See the documentation.
  log_level:
    name: "Log level"
    description: "Xray error log level. Access logs are always off."
